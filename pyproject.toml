[project]
name = "ingenuity-hitl"
version = "0.1.0"
description = "Ingenuity telemetry replay and atmospheric model experiments using Elodin binaries"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The standalone CLI tests add scripts/ to sys.path before importing its modules.
"tests/test_*.py" = ["E402"]
